name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: ["22.x", "24.x"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      # Without an extractor the PDF tests skip themselves, and the extraction
      # ladder — the part most likely to rot — would never actually run in CI.
      - run: sudo apt-get update && sudo apt-get install -y poppler-utils
      - run: npm install
      - run: npm test
      - run: npm run typecheck

  smoke:
    # Drives a real pi session with a scripted provider — no model, no API key.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24.x"
      - run: npm install
      - run: npm install -g --ignore-scripts @earendil-works/pi-coding-agent
      - run: npm run smoke

  shell:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: shellcheck
        run: shellcheck install.sh uninstall.sh skills/teach/scripts/log-answer.sh dev/smoke.sh
      - name: the installer must not be broken by a syntax error
        run: bash -n install.sh uninstall.sh dev/smoke.sh
